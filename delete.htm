<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Document</title>
    </head>
    <body>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-100 whitespace-nowrap">
                    <tr>
                        <th class="p-4 text-left text-[13px] font-semibold text-slate-900">
                            Name
                        </th>
                        <th class="p-4 text-left text-[13px] font-semibold text-slate-900">
                            Category
                        </th>
                        <th class="p-4 text-left text-[13px] font-semibold text-slate-900">
                            Price
                        </th>

                        <th class="p-4 text-left text-[13px] font-semibold text-slate-900">
                            Actions
                        </th>
                    </tr>
                </thead>

                <tbody id="listData" class="whitespace-nowrap">


                </tbody>
            </table>
        </div>

        <script>
            let listData = document.getElementById('listData')

            function getAllData() {
                fetch('https://69b3c331e224ec066bdd03a6.mockapi.io/api/v1/Product')
            .then(res => res.json())
            .then(getData => getData.map(item => 
            listData.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="p-4 text-[15px] text-slate-900 font-medium">
                        ${item.title}
                    </td>
                    <td class="p-4 text-[15px] text-slate-600 font-medium">
                          ${item.category}
                    </td>
                    <td class="p-4 text-[15px] text-slate-600 font-medium">
                       ${item.price}
                    </td>
                   
                    <td class="p-4">
                        <div class="flex items-center">
                            <button onclick="deleteData(${item.id})"  title="Delete" class="cursor-pointer">
                                <i class="fa-solid fa-trash-can text-red-600"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            
            `
            ))

            }

            function deleteData(id) {
                fetch(`https://69b3c331e224ec066bdd03a6.mockapi.io/api/v1/Product/${id}` , {
                    method: "DELETE"
                })
                .then(res => res.json())
                getAllData()

            }
            getAllData()
        </script>
    </body>
</html>
