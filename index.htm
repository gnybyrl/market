<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <header>
            <div class="flex flex-wrap justify-between items-center my-4 mx-20">
                <img class="w-[300px] cursor-pointer" src="https://themewagon.github.io/freshcart/assets/images/logo/freshcart-logo.svg" alt="">
                
                <div id="search" class="w-full max-w-sm min-w-[200px]">
                    <div class="relative">
                        <input id="srchinput"
                        class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md pl-3 pr-28 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow" />
                        <button
                        class="absolute top-1 right-1 flex items-center rounded bg-green-400 py-1 px-2.5 border border-transparent text-center text-sm text-white transition-all shadow-sm hover:shadow focus:bg-green-400 focus:shadow-none active:bg-green-600 hover:bg-green-600 active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none"
                        type="button"
                        >
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 mr-2">
                            <path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z" clip-rule="evenodd" />
                        </svg>
                    
                        Search
                        </button> 
                    </div>
                </div>

                <div onclick="openCart()" class="cursor-pointer">
                    <i class="fa-solid fa-cart-shopping text-green-400 mt-4 text-3xl"></i>
                    <span id="count" class="absolute left-auto -ml-1 top-6 rounded-full bg-yellow-400 px-1 py-0 text-xs text-white"></span>
                </div>
            </div>

        
        </header>
        <main>
            <div class="category">
                <ul id="categoryList" class="flex flex-wrap items-center justify-center mx-4 gap-4">
                    <li onclick="sortData('all')" class="bg-grey-400 p-2 rounded-xl cursor-pointer border border-green-400 text-green-400 text-md ">Hamısı</li>
                </ul>
            </div>
            <div id="cardList" class="grid grid-cols-1 m-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 max-xl:gap-4 gap-6">
            </div>


            <div id="cart" style="display: none;" class="fixed top-[25%] right-[35%] w-[500px] max-h-[500px] overflow-y-auto bg-white border border-yellow-400 p-4 rounded-lg">
                <div class="flex flex-wrap justify-between">
                    <h2 class="text-2xl text-yellow-400 mb-4">Səbət</h2>
                    <i onclick="openCart()" class="fa-solid fa-x text-lg text-yellow-400 mt-2 cursor-pointer "></i>
                </div>
                <hr class="text-green-400" />
                <div id="cartList">
                    
                </div>
                <div class="border-t border-green-400 pt-6 flex justify-end gap-4">
                    <button id="closeButton" type="button"
                        class="px-4 py-2.5 rounded-md text-slate-900 text-white text-sm font-medium border-none outline-none tracking-wide bg-yellow-400 hover:bg-yellow-600 active:bg-yellow-600 cursor-pointer">Continue
                        Shopping</button>
                    <button type="button"
                        class="px-4 py-2.5 rounded-md text-white text-sm font-medium border-none outline-none tracking-wide bg-green-400 hover:bg-green-600 active:bg-green-600 cursor-pointer">Proceed
                        to checkout</button>
                </div>

            </div>


        </main>


        <script src="app.js"></script>
    </body>
</html>
